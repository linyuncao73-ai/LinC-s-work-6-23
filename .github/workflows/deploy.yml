name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/scheduling-system-improvements-pf3cni
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          # Keep previous hashed chunks so pages opened before a deploy can
          # still lazy-load their modules (filenames are content-hashed, so
          # stale files never conflict).
          clean: false
